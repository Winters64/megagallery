name: Build and deploy to Free.fr

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-fr-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy dist to Free.fr
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ftpperso.free.fr
          username: ${{ secrets.FREE_FTP_USERNAME }}
          password: ${{ secrets.FREE_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: dist/
          server-dir: /megagallery/
